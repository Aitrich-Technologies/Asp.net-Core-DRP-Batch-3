<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Signup Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="validation.js" defer></script>
</head>
<body>

<div class="container">

    <div class="left">
        <button class="featured">Featured Package</button>
        <h1>Tropical Beach Paradise</h1>
        <ul>
            <li>5-Star Beachfront Resort</li>
            <li>All-Inclusive Meals</li>
        </ul>
        <p class="price">$1,299 </p>
    </div>

    <div class="right">
        <h2>Create Your Account</h2>

        <form name="signupForm" id="signupForm" onsubmit="return validateForm()">
            
            <div class="row">
                <div class="col">
                    <label>First Name</label>
                    <input type="text" name="fname">
                </div>

                <div class="col">
                    <label>Last Name</label>
                    <input type="text" name="lname">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                    </select>
                </div>

                <div class="col">
                    <label>Date of Birth</label>
                    <input type="date" name="dob">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Username</label>
                    <input type="text" name="username">
                </div>

                <div class="col">
                    <label>Email Address</label>
                    <input type="email" name="email">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Password</label>
                    <input type="password" name="password">
                </div>
            </div>

            <div class="row center-btn">
                <button type="submit" class="register-btn">Register</button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
