<div class="container tours-page mt-4">
  <h2 class="page-title">Tours</h2>

  <input
    type="text"
    class="form-control search-box mb-4"
    [(ngModel)]="search"
    (input)="onSearch()"
    placeholder="Search Tour"
  />

  <div class="row g-4">
    <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let tour of filteredTours">
      <div class="card tour-card h-100">
        <img [src]="tour.image" class="card-img-top" [alt]="tour.name" />

        <div class="card-body d-flex flex-column">
          <h4>
            {{ tour.name }}
          </h4>

          <p class="country">🌍 {{ tour.country }}</p>

          <p class="price">₹ {{ tour.price }}</p>

          <a
            class="btn btn-primary mt-auto"
            [routerLink]="['/tour-details', tour.id]"
          >
            View Details
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
