<div class="container mt-5">
  <div class="card p-4 shadow">
    <h2 class="text-center">Tour Booking</h2>

    <hr>

    <h4>{{ tourName }}</h4>

    <p>Destination: {{ destination }}</p>

    <p>Price Per Person: ₹{{ price }}</p>

    <hr>

    <div class="mb-3">
      <label>Customer Name :</label>

      <input type="text" class="form-control" [(ngModel)]="customerName" placeholder="Enter your name">
    </div>
<br>
    <div class="mb-3">
      <label>Number of Persons :</label>

      <input type="number" class="form-control" [(ngModel)]="persons" min="1">
    </div>

    <h5>Total Amount: ₹{{ totalAmount }}</h5>

    <button class="btn btn-primary w-100" (click)="bookNow()" [disabled]="isBooked">{{ isBooked ? 'Booked' : 'Book Now' }}</button>

    
    <p class="text-success mt-3">
      {{ message }}
    </p>

  </div>

</div>
