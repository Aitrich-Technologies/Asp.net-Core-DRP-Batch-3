<!DOCTYPE html>
<html>
<head>
    <title>Signup Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

<div class="container">

    <!-- Left Section -->
    <div class="left">
        <button class="featured">Featured Package</button>
        <h1>Tropical Beach Paradise</h1>
        <p>7 Days of sun, sand, and unforgettable memories</p>

        <ul>
            <li>5-Star Beachfront Resort</li>
            <li>All-Inclusive Meals</li>
            <li>Water Sports & Activities</li>
            <li>Airport Transfers</li>
        </ul>

        <p class="price">$1,299 <span class="old">$1,899</span></p>
    </div>

    <!-- Right Section -->
    <div class="right">
        <h2>Create Your Account</h2>
        <p>Fill in your details to get started</p>

        <form>
            <div class="row">
                <div class="col">
                    <label>First Name</label>
                    <input type="text" placeholder="John">
                </div>
                <div class="col">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe">
                </div>
            </div>

            <div class="row">
                
                <div class="col">
                    <label>Date of Birth</label>
                    <input type="date">
                </div>
            </div>

            <div class="row">
               
            </div>

            <div class="row">
                <div class="col">
                    <label>Phone Number</label>
                    <input type="text" placeholder="+1 (555) 123-4567">
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Password</label>
                    <input type="password" placeholder="Create a strong password">
                    <small>Must be at least 8 characters long</small>
                </div>
            </div>

           

        </form>
    </div>
</div>

</body>
</html>
