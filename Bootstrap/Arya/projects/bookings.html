<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Bookings</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #f5f6f8;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

.main-content {
    flex: 1;
}

.booking-header {
    background: #1e6be3;
    color: white;
    padding: 10px;
    font-weight: bold;
}

.footer {
    background: #1c1f26;
    color: white;
    padding: 20px;
}
</style>
</head>

<body>

<div class="main-content">

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm p-3">
    <div class="container">
        <img src="images/logo.jpeg" width="50" height="50">

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-4">
                
                <li class="nav-item"><a class="nav-link active" href="index_cus.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="Destination_con.html">Destinations</a></li>
                <li class="nav-item"><a class="nav-link" href="booking.html">My Bookings</a></li>
            </ul>
        </div>

        <h6>Arya</h6>
    </div>
</nav>

<!-- FORM -->
<div class="container mt-4">
    <h5>Add Booking</h5>

    <input type="text" id="name" class="form-control mb-2" placeholder="Enter Name">
    <input type="text" id="destination" class="form-control mb-2" placeholder="Enter Destination">
    <input type="date" id="date" class="form-control mb-2">

    <button class="btn btn-success" onclick="addBooking()">Save Booking</button>
</div>

<!-- TABLE -->
<div class="container mt-4">
    <div class="booking-header">Booking List</div>

    <table class="table bg-white">
        <thead>
            <tr>
                <th>Name</th>
                <th>Destination</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookingTable"></tbody>
    </table>
</div>

</div>

<!-- FOOTER -->
<div class="footer mt-auto">
    <div class="container">
        <div class="row">

            <!-- Logo -->
            <div class="col-md-3">
                <img src="images/logo.jpeg" width="50" height="50">
            </div>

            <!-- Links -->
            <div class="col-md-3">
                <h6>Quick Links</h6>
                <p>Home</p>
                <p>Destinations</p>
                <p>Tours</p>
            </div>

            <!-- Support -->
            <div class="col-md-3">
                <h6>Support</h6>
                <p>FAQs</p>
                <p>Contact</p>
            </div>

            <!-- Subscribe -->
            <div class="col-md-3">
                <h6>Subscribe</h6>
                <input type="email" class="form-control mb-2" placeholder="Enter your email">
                <button class="btn btn-primary">Join</button>
            </div>

        </div>

        <hr>
        <p class="text-center">
            © 2025. All rights reserved.
            <img src="images/fb.PNG" width="20" height="20">
            <img src="images/twitter.PNG" width="20" height="20">
            <img src="images/insta.PNG" width="20" height="20">
        </p>
    </div>

<!-- JAVASCRIPT -->
<script>

let bookings = [];
let editIndex = -1;

// ADD / UPDATE
function addBooking() {

    let name = document.getElementById("name").value;
    let destination = document.getElementById("destination").value;
    let date = document.getElementById("date").value;

    if(name === "" || destination === "" || date === "") {
        alert("Please fill all fields");
        return;
    }

    let booking = {
        name: name,
        destination: destination,
        date: date,
        status: "SUBMIT"
    };

    if(editIndex === -1) {
        bookings.push(booking);
    } else {
        bookings[editIndex] = booking;
        editIndex = -1;
    }

    displayBookings();
    clearForm();
}

// DISPLAY
function displayBookings() {

    let table = document.getElementById("bookingTable");
    table.innerHTML = "";

    bookings.forEach((b, index) => {

        let row = `
            <tr>
                <td>${b.name}</td>
                <td>${b.destination}</td>
                <td>${b.date}</td>
                <td>${b.status}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editBooking(${index})">Edit</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteBooking(${index})">Delete</button>
                </td>
            </tr>
        `;

        table.innerHTML += row;
    });
}

// DELETE
function deleteBooking(index) {
    bookings.splice(index, 1);
    displayBookings();
}

// EDIT
function editBooking(index) {

    let b = bookings[index];

    document.getElementById("name").value = b.name;
    document.getElementById("destination").value = b.destination;
    document.getElementById("date").value = b.date;

    editIndex = index;
}

// CLEAR FORM
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("destination").value = "";
    document.getElementById("date").value = "";
}

</script>

</body>
</html>
