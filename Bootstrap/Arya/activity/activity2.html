<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
 <style>
    /* Card styling */
    .tour-card {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      width: 250px;
    }

    .tour-img {
      width: 100%;
      border-radius: 10px;
    }

    /* Booking section */
    .booking {
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

<!--  Question 2 – Navbar -->
<nav class="d-flex justify-content-between p-3 bg-dark text-white">
  <div><b>TourSite</b></div>

  <div class="d-flex gap-3">
    <a href="#" class="text-white text-decoration-none">Home</a>
    <a href="#" class="text-white text-decoration-none">Tours</a>
    <a href="#" class="text-white text-decoration-none">Contact</a>
  </div>
</nav>

<!--  Question 1 – Tour Cards (Flexbox) -->
<div class="d-flex gap-3 p-4 justify-content-center">

  <div class="tour-card">
    <img src="image/Dubai.jpg" class="tour-img">
    <h5>Dubai</h5>
    <p>Amazing city</p>
  </div>

  <div class="tour-card">
    <img src="image/france-eiffel-tower_4x3.avif" class="tour-img">
    <h5>Paris</h5>
    <p>City of love</p>
  </div>

  <div class="tour-card">
    <img src="image/tokyo.jpg" class="tour-img">
    <h5>Tokyo</h5>
    <p>Modern culture</p>
  </div>

</div>

<!--  Question 3 – Center Button -->
<div class="booking bg-light">
  <button class="btn btn-primary">Book Now</button>
</div>

<!--  Question 4 – Responsive Cards -->
<div class="d-flex flex-wrap gap-3 p-4 justify-content-center">

  <div class="tour-card">Tour 1</div>
  <div class="tour-card">Tour 2</div>
  <div class="tour-card">Tour 3</div>
  <div class="tour-card">Tour 4</div>

</div>

<!-- Question 5 – Price Align Right -->
<div class="d-flex p-3 border">
  <span>Dubai Tour</span>
  <span class="ms-auto">$500</span>
</div>

<!-- Question 6 – Footer -->
<footer class="d-flex justify-content-between p-3 bg-dark text-white">
  <span>© 2026 Tour</span>
  <div>
    <span class="me-3">Privacy</span>
    <span>Terms</span>
  </div>
</footer>

 



    
</body>
</html>
