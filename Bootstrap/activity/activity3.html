<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> 
</head>

<body>
    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">TourSite</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link">Home</a></li>
                <li class="nav-item"><a class="nav-link">Tours</a></li>
                <li class="nav-item"><a class="nav-link">Booking</a></li>
                <li class="nav-item"><a class="nav-link">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="bg-primary text-white text-center p-5">
    <h1>Explore the World</h1>
</div>

<div id="slider" class="carousel slide" data-bs-ride="carousel">
    
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="image/Dubai.jpg" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="image/tokyo.jpg" class="d-block w-100">
        </div>
        <div class="carousel-item">
            <img src="image/france-eiffel-tower_4x3.avif" class="d-block w-100">
        </div>
    </div>
    
    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
 </div>
 <div class="container mt-5 text-center">
    <div class="row">
        <div class="col-md-4">
            <img src="image/Dubai.jpg"  class="img-thumbnail">
            <h5>Dubai</h5>
        </div>

        <div class="col-md-4">
            <img src="image/tokyo.jpg" class="img-thumbnail">
            <h5>japan</h5>
        </div>

        <div class="col-md-4">
            <img src="image/france-eiffel-tower_4x3.avif" class="img-thumbnail">
            <h5>France</h5>
        </div>
    </div>  
</div>

<div class="container mt-5">
    <div class="bg-light p-4 rounded">
        <h3>Booking Form</h3>

        <input type="text" class="form-control mb-3" placeholder="Name">
        <input type="email" class="form-control mb-3" placeholder="Email">
        <input type="text" class="form-control mb-3" placeholder="Destination">

        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#bookModal">
            Book Now
        </button>
    </div>
</div>

<div class="modal fade" id="bookModal">
    <div class="modal-dialog">
        <div class="modal-content p-3">

            <h4>Confirm Booking</h4>

            <input type="text" class="form-control mb-2" placeholder="Your Name">
            <input type="date" class="form-control mb-2">

            <button class="btn btn-success" onclick="showAlert()">Confirm</button>
            <button class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>

        </div>
    </div>
</div>

<button id="showAlertBtn" onclick="alertBtn()" class="btn btn-primary">Show Alert</button>
<div id="msg"></div>

<script>
    function alertBtn(){
        document.getElementById("msg").innerHTML = `<div class="alert alert-success">Booking Successfull</div>`;
        
    };
</script>
<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Tour System
</footer>


</body>
</html>
