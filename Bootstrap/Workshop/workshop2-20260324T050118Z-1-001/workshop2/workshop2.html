<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Signup Modal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <style>
    .modal-dialog {
      max-width: 610px; 
       margin-top: 35px;
    }
    .modal-content {
      border-radius: 0.75rem;
      overflow: hidden;
      height: 500px;
    }
    .left-image, .right-form {
      height: 100%;
    }
    .object-fit-cover {
      object-fit: cover;
      height: 100%;
      width: 100%;
    }
    .form-section {
      background-color: #eff0f0;
      padding: 1.5rem;
    }
  </style>
<body>

  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content"> 

      <div class="row g-0 h-100">
        
        <!-- Left: Static Image (Narrower) -->
        <div class="col-md-5 left-image">
          <img src="Images/bali.jpg" class="object-fit-cover" alt="Promo Image">
        </div>

        <!-- Right: Signup Form (Wider) -->
        <div class="col-md-7 right-form form-section">
          <h5 class="mb-3">Create Your Account</h5>
          <form>
            <div class="mb-2">
              <input type="text" class="form-control form-control-sm" placeholder="First Name">
            </div>
            <div class="mb-2">
              <input type="text" class="form-control form-control-sm" placeholder="Last Name">
            </div>
            <div class="mb-2">
              <select class="form-select form-select-sm">
                <option selected disabled>Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-2">
              <input type="date" class="form-control form-control-sm">
            </div>
            <div class="mb-2">
              <input type="text" class="form-control form-control-sm" placeholder="Username">
            </div>
            <div class="mb-2">
              <input type="email" class="form-control form-control-sm" placeholder="Email">
            </div>
            <div class="mb-2">
              <input type="tel" class="form-control form-control-sm" placeholder="Phone Number">
            </div>
            
          </form>
        </div>

      </div>

    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
