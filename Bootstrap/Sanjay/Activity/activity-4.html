<button type="button" class="btn btn-primary m-5" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Book Now
</button>


<!-- Modal -->
<div class="modal fade" id="exampleModal"  >
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Name <input type="text" class="form-control">
      </div>
      <div class="modal-body">
        Date <input type="date" class="form-control">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary">Confirm</button>
      </div>
    </div>
  </div>
</div>

<button id="showAlertBtn" onclick="alertBtn()" class="btn btn-primary">Show Alert</button>
<div id="msg"></div>

<script>
    function alertBtn(){
        document.getElementById("msg").innerHTML = `<div class="alert alert-success">Booking Successfull</div>`;
    };
</script>

<div>
