<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .card {
            text-align: center;
        }
        div {
            padding: 10px;
        }
        .button {
            align-items: center;
            height: 100vh;
        }
        button {
            background-color: lightblue;
            border-radius: 10px;
            color: white;
            border:1px solid lightgreen;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 23%;
            padding: 20px;
            background-color: lightblue;
            text-align: center;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .card {
                width: 48%;
            }
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="row d-flex justify-content-evenly ">
        <div class="card col-3">Dubai</div>
        <div class="card col-3">Paris</div>
        <div class="card col-3">Tokyo</div>
    </div>

    <div class="d-flex ">
        <div class="logo">Logo</div>
        <div class="home ms-auto">Home</div>
        <div class="tour">Tours</div>
        <div class="contact">Contact</div>
    </div>

    <div class="d-flex button  justify-content-center ">
        <button class="">Book Now</button>
    </div>

<div class="container">
    <div class="card">Tour 1</div>
    <div class="card">Tour 2</div>
    <div class="card">Tour 3</div>
    <div class="card">Tour 4</div>
</div>


<div class="d-flex">
    <div>Tour name</div>
    <div class="ms-auto">Price</div>
</div>


    <div class="d-flex " style="justify-content: space-between;">
        <div class="">@ 2026 tour</div>
        <div class="">Privacy</div>
        <div class="">Terms</div>
    </div>

    <div class=" d-flex" style="flex-direction: column;">
        <div class="">Image</div>
        <div class="">Name</div>
        <div class="">Price</div>
    </div>
</body>
</html>
