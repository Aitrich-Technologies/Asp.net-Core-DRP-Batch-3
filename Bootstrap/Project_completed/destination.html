<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
    <div class="container">

<div class="form-container">

<h2 class="text-center mb-4">Add Destination</h2>

<form>

<div class="mb-3">
<label class="form-label">Destination Name</label>
<input type="text" class="form-control" placeholder="Enter destination name">
</div>

<div class="mb-3">
<label class="form-label">Country</label>
<input type="text" class="form-control" placeholder="Enter country">
</div>

<div class="mb-3">
<label class="form-label">City</label>
<input type="text" class="form-control" placeholder="Enter city">
</div>

<div class="mb-3">
<label class="form-label">Price (₹)</label>
<input type="number" class="form-control" placeholder="Enter package price">
</div>

<div class="mb-3">
<label class="form-label">Duration</label>
<input type="text" class="form-control" placeholder="Example: 3 Days / 2 Nights">
</div>

<div class="mb-3">
<label class="form-label">Destination Image</label>
<input type="file" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Description</label>
<textarea class="form-control" rows="4" placeholder="Enter destination details"></textarea>
</div>



</form>
<div class="text-center">
<a href="destination_1.html"><button type="submit" class="btn btn-primary px-4">Confirm</button></a>
<button type="reset" class="btn btn-secondary px-4">Reset</button>
</div>                                                                                                                                                                                                                                    
</div>

</div>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
