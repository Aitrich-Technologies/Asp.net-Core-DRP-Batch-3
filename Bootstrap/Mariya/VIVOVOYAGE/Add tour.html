<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
 
</head>
<body>
    <div class="container">

<div class="form-box">

<h2 class="text-center mb-4">Add Tour Package</h2>

<form>

<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Tour Name</label>
        <input type="text" class="form-control" placeholder="Enter tour name">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Destination</label>
        <input type="text" class="form-control" placeholder="Enter destination">
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" class="form-control">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">End Date</label>
        <input type="date" class="form-control">
    </div>
</div>

<div class="row">
    <div class="col-md-6 mb-3">
        <label class="form-label">Price (₹)</label>
        <input type="number" class="form-control" placeholder="Enter price">
    </div>

    <div class="col-md-6 mb-3">
        <label class="form-label">Available Seats</label>
        <input type="number" class="form-control" placeholder="Enter seats">
    </div>
</div>

<div class="mb-3">
    <label class="form-label">Tour Image</label>
    <input type="file" class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Itinerary</label>
    <textarea class="form-control" rows="4" placeholder="Day-wise plan"></textarea>
</div>

<div class="mb-3">
    <label class="form-label">Description</label>
    <textarea class="form-control" rows="3" placeholder="Enter tour description"></textarea>
</div>

<div class="text-center">
    <button type="submit" class="btn btn-success px-4">Add Tour</button>
    <button type="reset" class="btn btn-secondary px-4">Reset</button>
</div>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>  
</body>
</html>
